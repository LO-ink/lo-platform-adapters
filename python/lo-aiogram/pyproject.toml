[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lo-aiogram"
version = "0.1.0"
description = "LO compatibility session for aiogram 3"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.31,<4"]
license = "MIT"
readme = "README.md"
license-files = ["LICENSE"]

[tool.setuptools.package-data]
lo_aiogram = ["contract.json"]
