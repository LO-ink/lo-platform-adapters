name: Publish emulator container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-emulator
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'LO-ink/lo-platform-adapters'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require exact-revision Adapter checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: make release-check
      - name: Check source consumers and distributions
        run: |
          python -m pip install build twine ./python/lo-aiogram ./python/lo-bot-api-emulator
          python -m unittest discover -s python/tests -v
          python -m build --outdir dist python/lo-aiogram
          python -m build --outdir dist python/lo-bot-api-emulator
          python -m twine check --strict dist/*
          python -m venv /tmp/lo-emulator-wheel-consumer
          /tmp/lo-emulator-wheel-consumer/bin/pip install dist/*.whl
          /tmp/lo-emulator-wheel-consumer/bin/python -m unittest discover -s python/tests -v
      - name: Check strict bot clients against the installed wheels
        working-directory: compatibility/bot-frameworks
        run: |
          npm ci
          LO_STRICT_PYTHON=/tmp/lo-emulator-wheel-consumer/bin/python npm run test:strict
      - name: Build and exercise the exact image
        run: |
          mkdir -p release
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('python/lo-bot-api-emulator/pyproject.toml', 'rb'))['project']['version'])")
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "EMULATOR_VERSION=$VERSION" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 --iidfile release/image-id.txt \
            --label org.opencontainers.image.source=https://github.com/LO-ink/lo-platform-adapters \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            python/lo-bot-api-emulator
          python scripts/check-emulator-container.py "$(cat release/image-id.txt)" --version "$VERSION" > release/container-smoke.json
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Refuse existing tags and publish the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/publish-emulator-container.py \
            "$(cat release/image-id.txt)" ghcr.io/lo-ink/lo-bot-api-emulator \
            "$EMULATOR_VERSION" "$GITHUB_SHA" release
      - name: Sign out of GHCR
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: emulator-container-release
          path: release/
          if-no-files-found: error
