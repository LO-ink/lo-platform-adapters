name: Adapter checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:package
      - run: npm pack --dry-run --workspace @lo-ink/adapter-webapp-compat
      - run: npm pack --dry-run --workspace @lo-ink/adapter-lo
      - run: npm pack --dry-run --workspace @lo-ink/adapter-lo-legacy
      - run: npm pack --dry-run --workspace @lo-ink/adapter-telegram-to-lo
      - run: npm pack --dry-run --workspace @lo-ink/adapter-telegram
      - run: npm pack --dry-run --workspace @lo-ink/bot-http-lo
      - run: npm pack --dry-run --workspace @lo-ink/adapter-vk
  bot-frameworks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compatibility/bot-frameworks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: compatibility/bot-frameworks/package-lock.json
      - run: npm ci
      - run: npm test
  aiogram:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: compatibility/aiogram
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: compatibility/aiogram/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -v
  strict-bot-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r compatibility/aiogram/requirements.txt ./python/lo-aiogram ./python/lo-bot-api-emulator build
      - run: python -m unittest discover -s python/tests -v
      - run: python -m build python/lo-aiogram && python -m build python/lo-bot-api-emulator
      - run: npm ci
        working-directory: compatibility/bot-frameworks
      - run: LO_STRICT_PYTHON=python npm run test:strict
        working-directory: compatibility/bot-frameworks
      - run: docker build -t lo-bot-api-emulator:ci python/lo-bot-api-emulator
        if: matrix.python == '3.13'
      - run: python scripts/check-emulator-container.py lo-bot-api-emulator:ci
        if: matrix.python == '3.13'
  publish-npm:
    needs: [test, bot-frameworks, aiogram, strict-bot-contract]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: LO-ink/lo-developer-tools/actions/publish-npm@c3563e61df6fc5712611715195824f14b9a89db6
        with:
          package-paths: '["packages/compat","packages/bot-http-lo","packages/telegram-to-lo","packages/vk","packages/telegram","packages/lo","packages/lo-legacy"]'
