name: Publish Python packages
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Adapter checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-python
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.releases.outputs.matrix }}
      has_releases: ${{ steps.releases.outputs.has_releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", package-manager-cache: false }
      - name: Require exact-revision Adapter checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          RELEASE_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
        run: make release-check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - id: releases
        run: |
          python -m pip install build==1.6.1
          python scripts/plan_python_release.py
  build:
    needs: plan
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install build and test dependencies
        run: python -m pip install build twine ./python/lo-aiogram ./python/lo-bot-api-emulator
      - name: Check the current LO contract
        run: python -m unittest discover -s python/tests -v
      - name: Build both distributions
        run: |
          python -m build --outdir dist python/lo-aiogram
          python -m build --outdir dist python/lo-bot-api-emulator
          python -m twine check --strict dist/*
      - name: Check wheel consumers
        run: |
          python -m venv /tmp/lo-wheel-consumer
          /tmp/lo-wheel-consumer/bin/pip install dist/*.whl
          /tmp/lo-wheel-consumer/bin/python -m unittest discover -s python/tests -v
      - name: Check source distribution consumers
        run: |
          python -m venv /tmp/lo-source-consumer
          /tmp/lo-source-consumer/bin/pip install dist/*.tar.gz
          /tmp/lo-source-consumer/bin/python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-lo-aiogram
          path: dist/lo_aiogram-*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-lo-bot-api-emulator
          path: dist/lo_bot_api_emulator-*
          if-no-files-found: error
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.has_releases == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - id: uploads
        env:
          RELEASE_PROJECT: ${{ matrix.project }}
        run: python scripts/plan_python_release.py --prepare-upload "$RELEASE_PROJECT" dist
      - name: Publish verified distributions
        if: steps.uploads.outputs.has_uploads == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: upload-dist
      - name: Verify public distribution hashes
        env:
          RELEASE_PROJECT: ${{ matrix.project }}
        run: python scripts/plan_python_release.py --verify-upload "$RELEASE_PROJECT" dist
